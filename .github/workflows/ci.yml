name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so a newly-disclosed advisory against UNCHANGED deps is caught by
  # the audit job even with no push/PR (push/PR alone only audits on changes).
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch: {}

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Test
        run: bun test
      - name: Standalone bundle builds
        run: bun run build:standalone

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
