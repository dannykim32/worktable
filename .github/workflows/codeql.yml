name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published queries catch anything already on main.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning is free on public repos; on a free private repo the upload
    # fails. Skip until the repo is public, then it runs on every push/PR.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # Don't scan generated output — `bundle/` (committed) and `dist/` are
          # built from `src/`+`hooks/`, which ARE scanned. Scanning the copies
          # only produces duplicate alerts of the source findings.
          config: |
            paths-ignore:
              - bundle
              - dist
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
