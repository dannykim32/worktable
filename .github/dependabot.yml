version: 2
# No "npm" ecosystem on purpose: Dependabot's npm updater edits package.json but
# does NOT maintain Bun's bun.lock, so every such PR fails CI's
# `bun install --frozen-lockfile`. App-dependency security is covered by
# `bun audit` (the CI audit job) plus GitHub's Dependabot security alerts;
# refresh versions deliberately with `bun update` + `bun test` when wanted.
updates:
  # Keep the GitHub Actions used by CI current (and their pins fresh).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
